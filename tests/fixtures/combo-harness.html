<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combo Harness</title>
  </head>
  <body>
    <form id="harnessForm">
      <div class="combo" data-combo="materials">
        <div class="floating-chip-row" aria-live="polite"></div>
        <div class="underlined-field">
          <input
            class="combo-input"
            data-testid="combo-input-materials"
            type="text"
            placeholder="食材・材料を入力"
            aria-label="食材・材料"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="materialsSuggestions"
            aria-expanded="false"
          />
          <button
            class="combo-picker"
            data-testid="combo-picker-materials"
            type="button"
            aria-label="食材・材料の候補を表示"
            aria-controls="materialsSuggestions"
            hidden
          ></button>
          <div
            id="materialsSuggestions"
            class="suggestions"
            data-testid="combo-suggestions-materials"
            role="listbox"
            aria-label="食材・材料の候補"
            aria-hidden="true"
          ></div>
        </div>
      </div>
      <button id="outside" type="button">outside</button>
    </form>
    <pre id="values"></pre>
    <script type="module" src="./combo-harness.ts"></script>
  </body>
</html>
